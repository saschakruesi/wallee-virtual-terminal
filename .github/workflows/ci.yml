name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Skip until web/ exists
        id: has-web
        run: |
          if [ -f web/package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - run: npm ci
        if: steps.has-web.outputs.present == 'true'
        working-directory: web
      - run: npm run lint --if-present
        if: steps.has-web.outputs.present == 'true'
        working-directory: web
      - run: npm test --if-present -- --run
        if: steps.has-web.outputs.present == 'true'
        working-directory: web
      - run: npm run build
        if: steps.has-web.outputs.present == 'true'
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: steps.has-web.outputs.present == 'true'
        with:
          name: web-dist
          path: web/dist

  helper:
    name: Helper (go vet, test, build)
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Skip until helper/ exists
        id: has-helper
        run: |
          if [ -f helper/go.mod ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/download-artifact@v4
        if: steps.has-helper.outputs.present == 'true'
        continue-on-error: true
        with:
          name: web-dist
          path: helper/dist
      - run: |
          mkdir -p dist && [ -f dist/index.html ] || echo '<!doctype html><title>placeholder</title>' > dist/index.html
          go vet ./... && go test ./... && go build -o wallee-virtual-terminal .
        if: steps.has-helper.outputs.present == 'true'
        working-directory: helper
